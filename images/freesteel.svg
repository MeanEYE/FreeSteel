<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
	<defs>
		<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f6f8fa"/>
			<stop offset="1" stop-color="#d3dbe2"/>
		</linearGradient>
		<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#3d5468"/>
			<stop offset="1" stop-color="#5f7a91"/>
		</linearGradient>
		<linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#62a0ea"/>
			<stop offset="1" stop-color="#1c71d8"/>
		</linearGradient>
		<linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f9e56b"/>
			<stop offset="1" stop-color="#e5a50a"/>
		</linearGradient>
	</defs>

	<!-- edge of the card, gives it thickness -->
	<rect x="8" y="28" width="112" height="80" rx="10" fill="#7d8e9d"/>

	<!-- card with steel coloured band along the top -->
	<rect x="8" y="24" width="112" height="80" rx="10" fill="url(#card)"/>
	<path d="M8 34a10 10 0 0 1 10-10h92a10 10 0 0 1 10 10v8H8z" fill="url(#band)"/>

	<!-- photo of the owner -->
	<rect x="18" y="50" width="34" height="44" rx="4" fill="url(#photo)"/>
	<circle cx="35" cy="66" r="7.5" fill="#ffffff"/>
	<path d="M22 94c0-9 5.8-15 13-15s13 6 13 15z" fill="#ffffff"/>

	<!-- chip -->
	<rect x="62" y="50" width="26" height="20" rx="4" fill="url(#chip)"/>
	<path d="M70.5 50v20M79.5 50v20M62 60h8.5M79.5 60h8.5" fill="none" stroke="#b5830a" stroke-width="1.5"/>

	<!-- lines of text -->
	<rect x="94" y="52" width="16" height="5" rx="2.5" fill="#aab6c1"/>
	<rect x="94" y="63" width="11" height="5" rx="2.5" fill="#aab6c1"/>
	<rect x="62" y="78" width="48" height="5" rx="2.5" fill="#7d8e9d"/>
	<rect x="62" y="89" width="34" height="5" rx="2.5" fill="#aab6c1"/>
</svg>
